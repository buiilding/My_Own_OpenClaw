name: CI

on:
  push:
  pull_request:

jobs:
  desktop-release-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate smoke scripts shell syntax
        run: |
          bash -n scripts/ci/smoke-linux-packages.sh
          bash -n scripts/ci/smoke-macos-packages.sh
      - name: Validate desktop release workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_path = Path(".github/workflows/desktop-release.yml")
          workflow = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
          jobs = workflow.get("jobs", {})
          package = jobs.get("package", {})
          publish = jobs.get("publish-release", {})
          if not package:
              raise SystemExit("Missing 'package' job in desktop-release.yml")
          if not publish:
              raise SystemExit("Missing 'publish-release' job in desktop-release.yml")

          matrix = package.get("strategy", {}).get("matrix", {}).get("include", [])
          labels = {item.get("label") for item in matrix}
          if labels != {"linux", "windows", "macos"}:
              raise SystemExit(f"Unexpected matrix labels: {labels}")

          steps = package.get("steps", [])
          step_names = {step.get("name") for step in steps}
          required_steps = {
              "Validate signing secrets",
              "Validate macOS signing/notarization secrets",
              "Package desktop artifact",
              "Smoke test packaged artifact (Linux/macOS)",
              "Smoke test packaged artifact (Windows)",
              "Upload packaged artifacts",
          }
          missing = sorted(required_steps - step_names)
          if missing:
              raise SystemExit(f"Missing required package steps: {missing}")

          print("desktop-release workflow contract: ok")
          PY

  pr-runtime-invariants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate PR runtime invariant checklist
        run: node scripts/check-pr-runtime-invariants.cjs

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          grep -vE '^\s*flash-attn(\s|$)' backend/requirements.txt > /tmp/backend-requirements-ci.txt
          pip install -r /tmp/backend-requirements-ci.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: ./scripts/test-backend

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sidecar dependencies
        run: pip install -r frontend/src/main/python/requirements.txt
      - name: Run sidecar tests
        env:
          PYTHONPATH: .
        run: ./scripts/test-sidecar

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend
