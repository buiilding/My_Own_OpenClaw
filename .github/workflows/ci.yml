name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          grep -vE '^\s*flash-attn(\s|$)' backend/requirements.txt > /tmp/backend-requirements-ci.txt
          pip install -r /tmp/backend-requirements-ci.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: ./scripts/test-backend

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sidecar dependencies
        run: pip install -r frontend/src/main/python/requirements.txt
      - name: Run sidecar tests
        env:
          PYTHONPATH: .
        run: ./scripts/test-sidecar

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend
