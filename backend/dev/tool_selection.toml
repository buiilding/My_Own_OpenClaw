# Dev tool selection (backend-only)
#
# Goal: make it easy to test isolated tool subsets by controlling which tool
# schemas get injected into the LLM prompt (and which tool calls are accepted).
#
# How it works:
# - If `enabled = false` (default), no filtering is applied.
# - If `mode = "denylist"`, every tool is available except those listed in `tools`.
# - If `mode = "allowlist"`, ONLY tools listed in `tools` are available.
#
# Notes:
# - Tool names are the tool schema names (e.g. "mouse_control", "browser_control",
#   "read_file"). See `backend/src/tools/remote.py` for the canonical list.
# - This is intended for development/testing. For normal behavior, keep disabled.
# - Method-level options are available under [tool_options.<tool_name>].

enabled = false
mode = "denylist" # "denylist" | "allowlist"

# Tools to disable (denylist) or enable (allowlist).
tools = [
  # "browser_control",
  # "mouse_control",
  # "keyboard_control",
]

# Optional method-level controls for mouse_control.
# If omitted, all methods are enabled.
[tool_options.mouse_control]
enabled_coordinate_methods = [
  "manual",
  "ocr",
]
